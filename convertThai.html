<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mistake Converter — Shinosan</title>
    <meta
      name="description"
      content="แปลงคำที่พิมพ์ผิดภาษา (ลืมเปลี่ยนภาษา) ให้เป็นภาษาไทยอัตโนมัติ"
    />
    <meta name="theme-color" content="#21242d" />

    <!-- CSS *not counter-strike : source -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="styles.css" />

    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Icon -->
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
    <script
      src="https://kit.fontawesome.com/75b539183b.js"
      crossorigin="anonymous"
    ></script>
  </head>

  <body>
    <div id="loader"></div>
    <div class="bg-img"></div>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-brand fixed-top navbar-scroll">
      <div class="container-fluid">
        <a class="navbar-brand cat-brand" href="./" aria-label="Home">
          <svg viewBox="0 0 64 64" role="img" aria-label="Cat logo">
            <path
              d="M10 5 L26 22 C29 20 35 20 38 22 L54 5 C52 15 51 22 51 28 C51 41 43 51 32 51 C21 51 13 41 13 28 C13 22 12 15 10 5 Z"
            />
          </svg>
        </a>
        <button
          class="navbar-toggler ms-auto pe-0"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarExample01"
          aria-controls="navbarExample01"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="d-flex justify-content-start align-items-center">
            <svg class="menu-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 6h18M3 12h18M3 18h18" />
            </svg>
          </span>
        </button>
        <div class="collapse navbar-collapse" id="navbarExample01">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link" href="./">Home</a>
            </li>
            <li class="nav-item active">
              <a class="nav-link" aria-current="page" href="./convertThai"
                >แปลงภาษา</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" href="./qrcode">QRCode</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Main -->
    <main class="page-center">
      <div class="info info--wide">
        <img class="tool-img" src="assets/PityShino.png" alt="Shino mascot" />

        <form onsubmit="return false;">
          <label for="changelang" class="tool-title">
            ใส่คำที่พิมพ์แล้วลืมเปลี่ยนภาษาลงไปเลยหนุ่ม
          </label>
          <div class="input-group mb-3">
            <input class="form-control" id="changelang" name="changelang" />
            <button
              class="btn btn-accent"
              type="submit"
              onclick="translateAndDisplay()"
            >
              Let's Go!
            </button>
          </div>
        </form>

        <p id="translatedText"></p>

        <span
          class="d-inline-block"
          tabindex="0"
          data-bs-toggle="tooltip"
          title="คลิกหนูเบาๆทีนึงพอ"
        >
          <button
            class="btn btn-outline-light"
            type="button"
            id="copy-button"
            onclick="copyFunc()"
            style="visibility: hidden"
          >
            Copy
          </button>
        </span>

        <p id="disclaimer" class="mt-3">
          This program is inspired from
          <a
            href="https://lullar-de-3.appspot.com/"
            target="_blank"
            rel="noopener"
            >Lullar's</a
          >
          "de = กำ"
        </p>
      </div>
    </main>

    <!-- Mastodon Verify -->
    <a class="visually-hidden" rel="me" href="https://mastodon.social/@shinosan"
      >Mastodon</a
    >
    <a class="visually-hidden" rel="me" href="https://mstdn.social/@shinosan"
      >Mastodon</a
    >

    <!-- Scripts -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
    ></script>
    <script src="script.js"></script>
  </body>
</html>
