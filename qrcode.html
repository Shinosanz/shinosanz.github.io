<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QR Code Generator — Shinosan</title>
    <meta
      name="description"
      content="Generate a QR code from any link, quickly."
    />
    <meta name="theme-color" content="#21242d" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="styles.css" />

    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Icon -->
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
    <script
      src="https://kit.fontawesome.com/75b539183b.js"
      crossorigin="anonymous"
    ></script>
  </head>

  <body>
    <div id="loader"></div>
    <div class="bg-img"></div>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-brand fixed-top navbar-scroll">
      <div class="container-fluid">
        <a class="navbar-brand cat-brand" href="./" aria-label="Home">
          <svg viewBox="0 0 64 64" role="img" aria-label="Cat logo">
            <path
              d="M10 5 L26 22 C29 20 35 20 38 22 L54 5 C52 15 51 22 51 28 C51 41 43 51 32 51 C21 51 13 41 13 28 C13 22 12 15 10 5 Z"
            />
          </svg>
        </a>
        <button
          class="navbar-toggler ms-auto pe-0"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarExample01"
          aria-controls="navbarExample01"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="d-flex justify-content-start align-items-center">
            <svg class="menu-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 6h18M3 12h18M3 18h18" />
            </svg>
          </span>
        </button>
        <div class="collapse navbar-collapse" id="navbarExample01">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link" href="./">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="./convertThai">แปลงภาษา</a>
            </li>
            <li class="nav-item active">
              <a class="nav-link" aria-current="page" href="./qrcode">QRCode</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Main -->
    <main class="page-center">
      <div class="info info--wide">
        <label for="qrText" class="tool-title">ใส่ลิ้งเข้าไปเลยลูก</label>
        <input
          class="form-control"
          type="text"
          placeholder="ลิ้งอะลูก ลิ้ง"
          id="qrText"
        />

        <div id="qrBox">
          <img
            src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=https://www.youtube.com/watch?v=dQw4w9WgXcQ"
            alt="Generated QR code"
            id="qrImage"
          />
        </div>

        <button class="btn btn-accent mt-3" onclick="generatorQR()">
          Generate
        </button>
      </div>
    </main>

    <!-- Mastodon Verify -->
    <a class="visually-hidden" rel="me" href="https://mastodon.social/@shinosan"
      >Mastodon</a
    >
    <a class="visually-hidden" rel="me" href="https://mstdn.social/@shinosan"
      >Mastodon</a
    >

    <!-- Scripts -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
    ></script>
    <script src="script.js"></script>
    <script>
      const imgbox = document.getElementById("qrBox");
      const qrImage = document.getElementById("qrImage");
      const qrText = document.getElementById("qrText");

      function generatorQR() {
        if (qrText.value.length > 0) {
          qrImage.src =
            "https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=" +
            encodeURIComponent(qrText.value);
          imgbox.style.display = "block";
        }
      }

      qrText.addEventListener("keydown", function (e) {
        if (e.key === "Enter") generatorQR();
      });
    </script>
  </body>
</html>
